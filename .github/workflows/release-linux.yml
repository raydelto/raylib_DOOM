name: release-linux

# A v* tag builds the Ubuntu x86_64 and arm64 packages and uploads them
# to the draft GitHub Release for the tag. workflow_dispatch, and pull
# requests that change the packaging, build them and keep them as an
# Actions artifact only. workflow_dispatch can also build an existing
# tag's source (input `tag`) as an artifact only, to try out packaging
# changes against a tag that is already released.
#
# A tag's packages ship the shareware DOOM1.WAD (downloaded at build
# time and checked by its SHA-256; never in git). Pull requests and
# dispatches stay WAD-free, unless a dispatch sets `shareware`.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release-linux.yml'
      - 'packaging/linux/**'
      - 'packaging/shareware/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (default: 0.0.0+git.<short sha>)'
        required: false
        default: ''
      tag:
        description: >-
          Existing tag to build (e.g. v0.1.0), with this run's
          packaging. Artifact only: never uploaded to a release.
        required: false
        default: ''
      shareware:
        description: >-
          Bundle the shareware DOOM1.WAD, as a tag does (the artifact
          then holds it)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04's glibc 2.35 is the oldest the binary has to run on,
          # on both architectures. ubuntu-22.04-arm is a native arm64
          # runner: no cross-compiling, no QEMU.
          - arch: amd64
            tar_arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            tar_arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # The packaging (this job's remaining steps) comes from the
      # revision this workflow runs on. A dispatch with a tag builds
      # only the game's source from that tag, checked out separately
      # below, in case the tag predates today's packaging.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          source=
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          elif [ -n "${INPUT_TAG}" ]; then
            case $INPUT_TAG in
              v*) ;;
              *) echo "not a v* tag: $INPUT_TAG" >&2; exit 1 ;;
            esac
            # Never creates the tag: it must already exist.
            git rev-parse --verify -q "refs/tags/$INPUT_TAG^{commit}" > /dev/null ||
              { echo "no tag $INPUT_TAG" >&2; exit 1; }
            source=refs/tags/$INPUT_TAG
            version=${INPUT_TAG#v}
          elif [ -n "${INPUT_VERSION}" ]; then
            version=${INPUT_VERSION#v}
          else
            version=0.0.0+git.$(git rev-parse --short=7 HEAD)
          fi
          # A native Debian version: starts with a digit, then only
          # letters, digits and . + ~ (no hyphen, no revision).
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9][A-Za-z0-9.+~]*$'; then
            echo "not a valid package version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "Version: $version, source ${source:-HEAD}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libgl1-mesa-dev libasound2-dev \
            lintian desktop-file-utils

      - name: Test the release upload script
        run: sh packaging/linux/test-upload-release.sh

      # A dispatch with a tag builds that tag's game source, not this
      # revision's, in a separate worktree: an older tag can predate
      # today's CMakeLists.txt or source layout.
      - name: Checkout the release source
        if: steps.version.outputs.source != ''
        run: git worktree add release-src "${{ steps.version.outputs.source }}"

      - name: Configure
        env:
          SOURCE: ${{ steps.version.outputs.source }}
        run: |
          src=.
          [ -z "$SOURCE" ] || src=release-src
          cmake -S "$src" -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      # A tag's packages ship the shareware DOOM1.WAD; everything else
      # stays WAD-free unless a dispatch asks for it. The WAD is
      # downloaded outside the checkout and must match its SHA-256.
      - name: Shareware DOOM1.WAD
        id: wad
        if: (github.event_name == 'push' && github.ref_type == 'tag') || inputs.shareware
        env:
          DOOM1_WAD_URL: ${{ vars.DOOM1_WAD_URL }}
        run: |
          [ -n "$DOOM1_WAD_URL" ] || unset DOOM1_WAD_URL
          wad=$RUNNER_TEMP/doom1-wad/DOOM1.WAD
          packaging/shareware/fetch-doom1-wad.sh "$wad"
          echo "path=$wad" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DOOM1_WAD: ${{ steps.wad.outputs.path }}
        run: |
          packaging/linux/make-packages.sh "$VERSION" build dist
          [ -z "$DOOM1_WAD" ] || packaging/shareware/check-wad-in-package.sh dist/*.deb dist/*.tar.gz

      - name: Check
        run: |
          desktop-file-validate packaging/linux/raylibdoom.desktop
          lintian --version
          lintian --fail-on error --display-info dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: raylibdoom-${{ steps.version.outputs.version }}-linux-${{ matrix.tar_arch }}
          path: dist/
          if-no-files-found: error

  # Install, run and remove the .deb on clean systems, to check that
  # its Depends resolve on both LTS releases (24.04 renamed libasound2),
  # on both architectures. The Ubuntu images are multi-arch, so the
  # container step pulls the arm64 variant natively on the arm64 runner.
  test:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04']
        arch: [amd64, arm64]
        include:
          - arch: amd64
            tar_arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            tar_arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: raylibdoom-${{ needs.package.outputs.version }}-linux-${{ matrix.tar_arch }}
          path: dist

      - name: Install, run, remove
        run: sh packaging/linux/test-deb.sh dist/raylibdoom_*_${{ matrix.arch }}.deb

  # Only a tag push releases. workflow_dispatch, even on a tag, keeps
  # the packages as an artifact; upload-release.sh checks this again.
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [package, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: raylibdoom-${{ needs.package.outputs.version }}-linux-*
          merge-multiple: true
          path: dist

      - name: Check
        working-directory: dist
        run: |
          sha256sum -c ./*.sha256
          sh ../packaging/shareware/check-wad-in-package.sh ./*.deb ./*.tar.gz

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: sh packaging/linux/upload-release.sh dist
