name: release-windows

# A v* tag builds the Windows x64 portable zip and uploads it to the
# draft GitHub Release for the tag. workflow_dispatch, and pull
# requests that change the packaging, build it and keep it as an
# Actions artifact only.
#
# A tag's zip ships the shareware DOOM1.WAD next to the exe (downloaded
# at build time and checked by its SHA-256; never in git). Pull
# requests and dispatches stay WAD-free, unless a dispatch sets
# `shareware`.

on:
  push:
    # Plain release tags only. A suffixed tag such as v0.1.3-omarchy
    # is not a valid package version and has its own release.
    tags: ['v*', '!v*-*']
  pull_request:
    paths:
      - '.github/workflows/release-windows.yml'
      - 'packaging/windows/**'
      - 'packaging/shareware/**'
      - 'linuxdoom-1.10/i_win32.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (default: 0.0.0+git.<short sha>)'
        required: false
        default: ''
      shareware:
        description: >-
          Bundle the shareware DOOM1.WAD, as a tag does (the artifact
          then holds it)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git zip unzip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          elif [ -n "${INPUT_VERSION}" ]; then
            version=${INPUT_VERSION#v}
          else
            version=0.0.0+git.$(git rev-parse --short=7 HEAD)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      # raylib 5.5 always comes from FetchContent, never from a raylib
      # installed in MSYS2. -static links libgcc and winpthread (and
      # anything else from MinGW) into the executable.
      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_DISABLE_FIND_PACKAGE_raylib=ON \
            -DCMAKE_EXE_LINKER_FLAGS=-static

      - name: Build
        run: cmake --build build

      # A tag's packages ship the shareware DOOM1.WAD; everything else
      # stays WAD-free unless a dispatch asks for it. The WAD is
      # downloaded outside the checkout and must match its SHA-256.
      - name: Shareware DOOM1.WAD
        id: wad
        if: (github.event_name == 'push' && github.ref_type == 'tag') || inputs.shareware
        env:
          DOOM1_WAD_URL: ${{ vars.DOOM1_WAD_URL }}
        run: |
          [ -n "$DOOM1_WAD_URL" ] || unset DOOM1_WAD_URL
          wad=$(cygpath -u "$RUNNER_TEMP")/doom1-wad/DOOM1.WAD
          packaging/shareware/fetch-doom1-wad.sh "$wad"
          echo "path=$wad" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          DOOM1_WAD: ${{ steps.wad.outputs.path }}
        run: |
          gcc --version | head -1
          packaging/windows/make-package.sh "${{ steps.version.outputs.version }}" build dist
          objdump -p build/raylibdoom.exe | grep -E 'DLL Name|Subsystem'
          [ -z "$DOOM1_WAD" ] || packaging/shareware/check-wad-in-package.sh dist/*.zip

      # Unzip the package in an empty folder and run it with no IWAD
      # (a shareware zip's DOOM1.WAD is removed first): it must start
      # without any MinGW DLL, look for the IWAD next to itself, and
      # exit with an error. The runner has no GPU, so the game is not
      # played here; that is tested on real hardware.
      - name: Smoke test
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip
          $dir = Join-Path $env:RUNNER_TEMP smoke
          Expand-Archive $zip -DestinationPath $dir
          $exe = Get-ChildItem $dir -Recurse -Filter raylibdoom.exe
          $wad = Join-Path $exe.DirectoryName DOOM1.WAD
          if (Test-Path $wad) {
            $sum = (Get-FileHash $wad -Algorithm SHA256).Hash.ToLower()
            if ($sum -ne '1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771') { throw "DOOM1.WAD: $sum" }
            Remove-Item $wad
          }
          Push-Location $env:RUNNER_TEMP
          $out = & $exe.FullName -nosound 2>&1 | Out-String
          $code = $LASTEXITCODE
          Pop-Location
          Write-Output $out
          if ($code -eq 0) { throw "expected a non-zero exit with no IWAD" }
          if ($out -notmatch 'IWAD') { throw "no IWAD message" }
          if (-not $out.Contains($exe.DirectoryName)) { throw "did not look next to the exe" }
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: raylibdoom-${{ steps.version.outputs.version }}-windows-x64
          path: dist/
          if-no-files-found: error

  # The draft-release upload, against a fake gh: a published release is
  # never changed. Runs on every trigger, before any real upload.
  upload-script-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test upload-to-draft.sh
        run: sh packaging/windows/test-upload-to-draft.sh

  # Only a tag push publishes. workflow_dispatch, even on a tag, and
  # pull_request only build the artifact.
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [package, upload-script-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: raylibdoom-${{ needs.package.outputs.version }}-windows-x64
          path: dist

      - name: Check
        working-directory: dist
        run: |
          sha256sum -c ./*.sha256
          sh ../packaging/shareware/check-wad-in-package.sh ./*.zip

      # Uploads only to a draft (the oldest, if the OS jobs raced to
      # create two) and fails, changing nothing, if the tag's release
      # is already published.
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh packaging/windows/upload-to-draft.sh "${{ github.ref_name }}" dist/*
