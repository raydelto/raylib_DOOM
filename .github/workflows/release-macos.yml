name: release-macos

# A pushed v* tag builds the Apple Silicon .dmg and uploads it to the
# draft GitHub Release for the tag. workflow_dispatch, and pull requests
# that change the macOS packaging, build it and keep it as an Actions
# artifact only.
#
# A tag's app ships the shareware DOOM1.WAD in Contents/Resources
# (downloaded at build time and checked by its SHA-256; never in git).
# Pull requests and dispatches stay WAD-free, unless a dispatch sets
# `shareware`.
#
# Signing is ad-hoc until these repository secrets are added; then the
# app and dmg are signed with the Developer ID and the dmg notarized:
#   MACOS_CERT_P12        base64 of the Developer ID Application .p12
#   MACOS_CERT_PASSWORD   its password
#   MACOS_SIGN_IDENTITY   e.g. "Developer ID Application: Name (TEAMID)"
#   MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_TEAM_ID,
#   MACOS_NOTARY_PASSWORD (an app-specific password)

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release-macos.yml'
      - 'packaging/macos/**'
      - 'packaging/shareware/**'
      # The app's startup and linking.
      - 'CMakeLists.txt'
      - 'linuxdoom-1.10/i_main.c'
      - 'linuxdoom-1.10/i_video.c'
      - 'linuxdoom-1.10/i_system.h'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (default: 0.0.0+git.<short sha>)'
        required: false
        default: ''
      shareware:
        description: >-
          Bundle the shareware DOOM1.WAD, as a tag does (the artifact
          then holds it)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          elif [ -n "${INPUT_VERSION}" ]; then
            version=${INPUT_VERSION#v}
          else
            version=0.0.0+git.$(git rev-parse --short=7 HEAD)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build -j

      - name: Import the signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        if: env.MACOS_CERT_P12 != ''
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      # A tag's packages ship the shareware DOOM1.WAD; everything else
      # stays WAD-free unless a dispatch asks for it. The WAD is
      # downloaded outside the checkout and must match its SHA-256.
      - name: Shareware DOOM1.WAD
        id: wad
        if: (github.event_name == 'push' && github.ref_type == 'tag') || inputs.shareware
        env:
          DOOM1_WAD_URL: ${{ vars.DOOM1_WAD_URL }}
        run: |
          [ -n "$DOOM1_WAD_URL" ] || unset DOOM1_WAD_URL
          wad=$RUNNER_TEMP/doom1-wad/DOOM1.WAD
          packaging/shareware/fetch-doom1-wad.sh "$wad"
          echo "path=$wad" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          DOOM1_WAD: ${{ steps.wad.outputs.path }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: packaging/macos/make-dmg.sh "${{ steps.version.outputs.version }}" build dist

      - name: Check
        env:
          DOOM1_WAD: ${{ steps.wad.outputs.path }}
        run: |
          dmg=$(ls dist/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          app=$mnt/raylibDOOM.app
          ls -la "$mnt"
          lipo -info "$app/Contents/MacOS/raylibdoom"
          vtool -show-build "$app/Contents/MacOS/raylibdoom"
          otool -L "$app/Contents/MacOS/raylibdoom"
          plutil -p "$app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(lipo -archs "$app/Contents/MacOS/raylibdoom")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = 11.0
          test -f "$app/Contents/Resources/raylibDOOM.icns"
          test -L "$mnt/Applications"
          test -f "$mnt/README.txt"
          # With no IWAD anywhere, the app logs that (and shows a
          # dialog, which nobody closes here). With the shareware
          # DOOM1.WAD inside, it plays that one.
          if [ -n "$DOOM1_WAD" ]; then
            wad=$app/Contents/Resources/DOOM1.WAD
            test "$(shasum -a 256 "$wad" | cut -d' ' -f1)" = \
              1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771
            test -f "$app/Contents/Resources/licenses/DOOM1-NOTICE.txt"
            test -f "$mnt/DOOM1-NOTICE.txt"
          else
            if ls "$app/Contents/Resources" | grep -qi '\.wad$'; then exit 1; fi
          fi
          home=$(mktemp -d)
          HOME=$home DOOMWADDIR= "$app/Contents/MacOS/raylibdoom" -nosound \
            > /dev/null 2>&1 < /dev/null &
          pid=$!
          sleep 10
          kill $pid 2>/dev/null || true
          sleep 2
          kill -9 $pid 2>/dev/null || true
          wait $pid 2>/dev/null || true
          cat "$home/Library/Logs/raylibDOOM.log"
          if [ -n "$DOOM1_WAD" ]; then
            grep -q 'Contents/Resources/DOOM1.WAD' "$home/Library/Logs/raylibDOOM.log"
          else
            grep -q 'No IWAD found' "$home/Library/Logs/raylibDOOM.log"
          fi
          hdiutil detach "$mnt" || { sleep 5; hdiutil detach -force "$mnt"; }

      - uses: actions/upload-artifact@v4
        with:
          name: raylibdoom-${{ steps.version.outputs.version }}-macos-arm64
          path: dist/
          if-no-files-found: error

  # Only a pushed tag publishes; workflow_dispatch stays artifact-only
  # even when started on a tag.
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging/macos

      - uses: actions/download-artifact@v4
        with:
          name: raylibdoom-${{ needs.package.outputs.version }}-macos-arm64
          path: dist

      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: packaging/macos/upload-release.sh "${{ github.ref_name }}" dist
