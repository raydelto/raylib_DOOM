name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install raylib dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: raylibdoom-${{ matrix.os }}
          path: build/raylibdoom

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10
          actions-cache-folder: emsdk-cache

      # Downloads Freedoom 0.13.0 (checked against its SHA-256) and
      # builds raylib 5.5 for the web.
      - name: Configure
        run: emcmake cmake -B build-web

      - name: Build
        run: cmake --build build-web -j

      - name: Sizes
        run: ls -l build-web/raylibdoom.* build-web/freedoom-COPYING.txt

      - uses: actions/upload-artifact@v4
        with:
          name: raylibdoom-web
          path: |
            build-web/raylibdoom.html
            build-web/raylibdoom.js
            build-web/raylibdoom.wasm
            build-web/raylibdoom.data
            build-web/freedoom-COPYING.txt

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner's SDK has the build tools; Gradle needs this NDK
      # and CMake as well.
      - name: Install the NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.1.13356709" "cmake;3.22.1" > /dev/null

      # Builds raylib 5.5 for Android, then both flavors for
      # arm64-v8a and x86_64, and the release variant (unsigned: the
      # signed one is made by release-android.yml on a tag).
      - name: Build
        working-directory: android
        run: ./gradlew --no-daemon assembleFlatDebug assembleXrDebug assembleFlatRelease testFlatDebugUnitTest

      # No WAD, of any kind or name, may be in an APK.
      - name: Check for game data
        run: |
          sh packaging/android/test-check-no-wad.sh
          sh packaging/android/check-no-wad.sh android/app/build/outputs/apk/*/*/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: raylibdoom-android
          path: |
            android/app/build/outputs/apk/flat/debug/app-flat-debug.apk
            android/app/build/outputs/apk/xr/debug/app-xr-debug.apk
