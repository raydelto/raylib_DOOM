name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install raylib dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: raylibdoom-${{ matrix.os }}
          path: build/raylibdoom

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10
          actions-cache-folder: emsdk-cache

      # Downloads Freedoom 0.13.0 (checked against its SHA-256) and
      # builds raylib 5.5 for the web.
      - name: Configure
        run: emcmake cmake -B build-web

      - name: Build
        run: cmake --build build-web -j

      - name: Sizes
        run: ls -l build-web/raylibdoom.* build-web/freedoom-COPYING.txt

      - uses: actions/upload-artifact@v4
        with:
          name: raylibdoom-web
          path: |
            build-web/raylibdoom.html
            build-web/raylibdoom.js
            build-web/raylibdoom.wasm
            build-web/raylibdoom.data
            build-web/freedoom-COPYING.txt

  ps2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The ps2dev/ps2dev toolchain with raylib4PlayStation2 built in
      # (packaging/ps2/Dockerfile). Run with docker, not as the job's
      # container: actions like checkout can't run in its Alpine.
      - name: Build the toolchain image
        run: docker build -t raylibdoom-ps2 packaging/ps2

      - name: Build
        run: >
          docker run --rm -v "$PWD:/src" -w /src raylibdoom-ps2
          packaging/ps2/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: raylibdoom-ps2
          path: build-ps2/DOOM.ELF

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner's SDK has the build tools; Gradle needs this NDK
      # and CMake as well.
      - name: Install the NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.1.13356709" "cmake;3.22.1" > /dev/null

      # Downloads Freedoom 0.13.0 (checked against its SHA-256) and
      # builds raylib 5.5 for Android, then both flavors for
      # arm64-v8a and x86_64.
      - name: Build
        working-directory: android
        run: ./gradlew --no-daemon assembleFlatDebug assembleXrDebug

      - uses: actions/upload-artifact@v4
        with:
          name: raylibdoom-android
          path: |
            android/app/build/outputs/apk/flat/debug/app-flat-debug.apk
            android/app/build/outputs/apk/xr/debug/app-xr-debug.apk
