// The APK: ../../CMakeLists.txt built with the NDK as
// libraylibdoom.so (-DRAYLIB_DOOM_ANDROID=ON), run by NativeActivity,
// started by the Java launcher (WadActivity), which finds the
// player's own WADs. No game data goes into the APK.
//
//   flat: a normal Android app (phones, tablets, Android XR panel)
//   xr:   the same, plus OpenXR (Android XR Full Space)
//
// ./gradlew assembleFlatDebug assembleXrDebug
// ./gradlew assembleFlatRelease -PappVersion=1.2.3
//
// A release build is signed only when -PreleaseKeystore=FILE is given,
// with the passwords and alias in the environment (ANDROID_KEYSTORE_
// PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD), as
// .github/workflows/release-android.yml does; otherwise it is left
// unsigned (app-<flavor>-release-unsigned.apk).

plugins {
    id 'com.android.application'
}

// The version, from the tag (v1.2.3 -> -PappVersion=1.2.3). versionCode
// is major*1000000 + minor*1000 + patch, so every release installs over
// the one before; anything after the patch number (1.2.3-rc1) is
// left out of it.
def appVersion = providers.gradleProperty('appVersion').getOrElse('0.0.0-dev')
def versionParts = (appVersion =~ /^(\d+)\.(\d+)\.(\d+)/)
if (!versionParts.find())
    throw new GradleException("appVersion ${appVersion} is not MAJOR.MINOR.PATCH")
def appVersionCode = Math.max(1, versionParts.group(1).toInteger() * 1000000
                                 + versionParts.group(2).toInteger() * 1000
                                 + versionParts.group(3).toInteger())
// The source of exactly this build, for the About screen (GPL-2.0).
def sourceUrl = providers.gradleProperty('appVersion').isPresent()
    ? "https://github.com/raydelto/raylib_DOOM/tree/v${appVersion}"
    : 'https://github.com/raydelto/raylib_DOOM'

def releaseKeystore = providers.gradleProperty('releaseKeystore')

// The licenses, shown by About / Licenses in the launcher: assets/
// licenses/<name> for each file.
abstract class LicenseAssets extends DefaultTask {
    @Input abstract MapProperty<String, String> getNames()
    @InputFiles abstract ConfigurableFileCollection getSources()
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    @TaskAction
    void copy() {
        File out = new File(outputDir.get().asFile, 'licenses')
        out.deleteDir()
        out.mkdirs()
        names.get().each { from, name ->
            new File(out, name).bytes = new File(from).bytes
        }
    }
}

def licenseFiles = [
    '../LICENSE.TXT': 'COPYING-GPL-2.0.txt',
    '../linuxdoom-1.10/opl3-LICENSE.txt': 'Nuked-OPL3-LGPL-2.1.txt',
    '../packaging/android/THIRD-PARTY-NOTICES.txt': 'THIRD-PARTY-NOTICES.txt',
    '../packaging/android/Apache-2.0.txt': 'Apache-2.0.txt',
].collectEntries { k, v -> [rootProject.file(k).path, v] }

def licenses = tasks.register('licenseAssets', LicenseAssets) {
    names = licenseFiles
    sources.from(licenseFiles.keySet())
    outputDir = layout.buildDirectory.dir('generated/licenses')
}

android {
    namespace 'com.raylib.doom'
    compileSdk 36
    ndkVersion '28.1.13356709'

    defaultConfig {
        applicationId 'com.raylib.doom'
        // AAudio for raylib's miniaudio; the OpenXR loader wants 24.
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersion
        buildConfigField 'String', 'SOURCE_URL', "\"${sourceUrl}\""

        ndk {
            // Devices, and the x86_64 emulator.
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DRAYLIB_DOOM_ANDROID=ON'
                targets 'raylibdoom'
            }
        }
    }

    flavorDimensions = ['output']
    productFlavors {
        flat {
            dimension 'output'
        }
        xr {
            dimension 'output'
            applicationIdSuffix '.xr'
            externalNativeBuild {
                cmake {
                    arguments '-DRAYLIB_DOOM_ANDROID_XR=ON'
                }
            }
        }
    }

    signingConfigs {
        if (releaseKeystore.isPresent()) {
            release {
                storeFile file(releaseKeystore.get())
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseKeystore.isPresent() ? signingConfigs.release : null
        }
    }

    buildFeatures {
        buildConfig true
        prefab true
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs {
            // NativeActivity dlopens the library from the APK.
            useLegacyPackaging false
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(licenses) { it.outputDir }
    }
}

dependencies {
    // The Khronos OpenXR loader, as a prefab package for CMake.
    xrImplementation 'org.khronos.openxr:openxr_loader_for_android:1.1.52'
}
